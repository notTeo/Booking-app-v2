name: CI

on:
  push:
  pull_request:
    branches: [dev, main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The suite must pass under a UTC, an east-of-UTC and a west-of-UTC
      # machine: server-local-time bugs used to hide here.
      matrix:
        tz: [UTC, Europe/Athens, America/New_York]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Must contain "test": the suite refuses to run against anything else.
          POSTGRES_DB: booking_app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_app_test
      TZ: ${{ matrix.tz }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build (what the Docker image runs)
        run: npm run build
      - name: Tests
        run: npm test

  schema:
    # Migrations and prisma/schema.prisma must agree, and the hand-written
    # Booking_no_overlap exclusion constraint (which Prisma cannot model) must
    # survive: `migrate diff` proposing to drop it would show up here.
    name: Schema matches migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_schema_check
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_schema_check
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy
      - name: No difference between the migrated database and schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: The overlap guard exists
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          test "$(psql "$DATABASE_URL" -tAc "select count(*) from pg_constraint where conname = 'Booking_no_overlap'")" = "1"

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The app refuses to start without it; nothing here talks to it.
      VITE_API_URL: http://localhost:3000
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    # Real browser, real API, real Postgres: the booking flows end to end.
    # Playwright starts the API and the Vite dev server itself (see
    # e2e/playwright.config.ts); prepare-db.mjs drops/recreates booking_e2e,
    # applies the real migrations and seeds one shop + owner.
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGUSER: postgres
      # The preparer refuses any database whose name does not contain "e2e".
      E2E_DB_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_e2e
      # Playwright's own Chromium instead of the locally installed Chrome.
      E2E_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npx prisma generate
        working-directory: api
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run e2e
        run: npm run e2e
        working-directory: e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7
