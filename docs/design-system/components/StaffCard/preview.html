<!-- @dsCard group="Booking flow" height=1300 subtitle="Staff card: avatar, name, role, selected, off today" -->
<style>
body{margin:0;padding:16px;background:var(--bg);color:var(--text)}
.ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;align-items:start}
.ds-grid--one{grid-template-columns:minmax(0,1fr)}
.ds-phones{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.ds-panel{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:20px;min-width:0}
.ds-phone{width:360px;max-width:100%;padding:16px;gap:16px}
.ds-tag{font:600 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.ds-section-tag{margin:20px 0 10px;font:600 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.ds-sub{font:600 12px/16px var(--font-body);color:var(--text-muted);margin:0 0 -8px}
.ds-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.ds-row--center{align-items:center}
.ds-col{display:flex;flex-direction:column;gap:12px}
.ds-cell{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ds-cap{font:400 11px/14px var(--font-body);color:var(--text-muted)}
.ds-stage{position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--border);background:var(--bg)}
.ds-stage .modal-backdrop,.ds-stage .toast-region,.ds-stage .scrim{position:absolute}
.ds-stage .modal{animation:none}
.ds-stage .sidebar.is-drawer{position:absolute}
.ds-fake{padding:16px;display:flex;flex-direction:column;gap:10px}
.ds-fake i{display:block;height:10px;border-radius:5px;background:var(--surface-sunken)}
.ds-toast-stack{position:static;width:auto;display:flex;flex-direction:column;gap:8px}
@media (max-width:480px){.ds-phone{width:100%}}
</style>
