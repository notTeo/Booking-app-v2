<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeBooked — Online κρατήσεις για κουρεία και σαλόνια ομορφιάς</title>
    <meta name="description" content="Το BeBooked είναι η πλατφόρμα κρατήσεων για κουρεία και σαλόνια ομορφιάς. Δέξου ραντεβού online και διαχειρίσου ομάδα, υπηρεσίες και πελάτες από ένα μέρος." />
    <link rel="canonical" href="https://bebooked.gr/" />
    <meta name="theme-color" content="#166534" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Installable from the home screen; opens on the dashboard (see manifest). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BeBooked" />
    <!-- "default" keeps the page below the iPhone status bar, so headers aren't covered. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BeBooked" />
    <meta property="og:locale" content="el_GR" />
    <meta property="og:title" content="BeBooked — Online κρατήσεις για κουρεία και σαλόνια ομορφιάς" />
    <meta property="og:description" content="Δέξου ραντεβού online και διαχειρίσου ομάδα, υπηρεσίες και πελάτες από ένα μέρος." />
    <meta property="og:url" content="https://bebooked.gr/" />
    <meta property="og:image" content="https://bebooked.gr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BeBooked — Online κρατήσεις για κουρεία και σαλόνια ομορφιάς" />
    <meta name="twitter:description" content="Δέξου ραντεβού online και διαχειρίσου ομάδα, υπηρεσίες και πελάτες από ένα μέρος." />
    <meta name="twitter:image" content="https://bebooked.gr/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BeBooked",
        "url": "https://bebooked.gr/",
        "inLanguage": ["el", "en"]
      }
    </script>
    <script>
      // Set data-theme before first paint. Mirrors ThemeContext: same "theme"
      // cookie, values "light"/"dark", light by default.
      try {
        var m = document.cookie.match(/(?:^|; )theme=([^;]*)/);
        var t = m ? decodeURIComponent(m[1]) : 'light';
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        // The colour set applies inside the app and on the marketing and login pages
        // (mirrors AppPalette and the "palette" cookie), so a reload there
        // does not flash the original.
        var p = document.cookie.match(/(?:^|; )palette=([^;]*)/);
        var inApp = /^\/((dashboard|account|shops)(\/|$)|(about|pricing|contact|privacy|terms|dpa|login|register|forgot-password|reset-password|verify-email|verify-email-change|invite)?\/?$)/.test(location.pathname);
        if (inApp && p && (p[1] === 'mono' || p[1] === 'purple')) {
          document.documentElement.setAttribute('data-palette', p[1]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Drags the installed desktop app's window (see .titlebar in components.css). -->
    <div class="titlebar" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
