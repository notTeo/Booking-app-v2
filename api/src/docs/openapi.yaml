openapi: 3.0.3
info:
  title: BeBooked API
  description: |
    BeBooked backend API: email/password authentication (JWT access tokens, refresh token
    rotation with reuse detection, email verification, sessions), multi-tenant shops, and
    the public booking endpoints. Only a subset of routes is described in this file.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: health
    description: Service health check
  - name: auth
    description: Authentication and session management
  - name: user
    description: Current user profile operations
  - name: overview
    description: Shop dashboard aggregates

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained from `/auth/login` or `/auth/refresh`

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: clxyz123abc
        email:
          type: string
          format: email
          example: user@example.com
        isVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
        family:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
          example: Something went wrong

    ValidationErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    OverviewResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/OverviewData'

    OverviewData:
      type: object
      required: [range, from, to, today, hasAnyBookings, totals, buckets]
      properties:
        range:
          type: string
          enum: [week, month, quarter]
        from:
          type: string
          format: date
          description: First day of the period, a calendar date in the shop's timezone.
        to:
          type: string
          format: date
          description: Last day of the period (inclusive), in the shop's timezone.
        today:
          type: string
          format: date
          description: The shop-local date the period was computed for. Buckets starting after it are in the future.
        hasAnyBookings:
          type: boolean
          description: Whether the shop has any booking at all (any period, any status).
        totals:
          type: object
          required: [all, pending, confirmed, completed, canceled, noShow]
          description: >
            Booking counts by status for bookings starting in the period,
            including future ones.
            `all` is every non-canceled booking, i.e. the sum of the bucket counts.
          properties:
            all: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
            confirmed: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
            canceled: { type: integer, minimum: 0 }
            noShow: { type: integer, minimum: 0 }
        buckets:
          type: array
          description: >
            Non-canceled bookings per bucket, oldest first; the buckets cover
            exactly [from, to] with no gaps. Always complete, empty buckets
            have count 0. week: 7 daily buckets; month: one daily bucket per
            day of the month (28-31); quarter: Monday-start weekly buckets
            (13-14), the first and last clipped to the period.
          items:
            type: object
            required: [start, end, count]
            properties:
              start: { type: string, format: date }
              end: { type: string, format: date, description: Inclusive. }
              count: { type: integer, minimum: 0 }

    MyOverviewResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          allOf:
            - $ref: '#/components/schemas/OverviewData'
            - type: object
              required: [perShop]
              properties:
                perShop:
                  type: array
                  description: >
                    One entry per shop the user is an active member of, sorted by
                    `total` descending, then by name. Empty for a user with no shops.
                  items:
                    type: object
                    required: [shopId, name, slug, total, pending, today]
                    properties:
                      shopId: { type: string }
                      name: { type: string }
                      slug: { type: string }
                      total:
                        type: integer
                        minimum: 0
                        description: Non-canceled bookings in the period (this shop's share of `totals.all`).
                      pending:
                        type: integer
                        minimum: 0
                        description: Pending bookings in the period.
                      today:
                        type: integer
                        minimum: 0
                        description: Non-canceled bookings starting today, "today" being in THIS shop's timezone.

    UpcomingBookingsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          description: The next 5 bookings from now across the user's shops, soonest first. Canceled and no-show are excluded.
          maxItems: 5
          items:
            type: object
            required: [id, shopId, startTime, endTime, status, customer, service, staff, shop]
            properties:
              id: { type: string }
              shopId: { type: string }
              startTime: { type: string, format: date-time }
              endTime: { type: string, format: date-time }
              status: { type: string, enum: [PENDING, CONFIRMED, COMPLETED, CANCELED, NO_SHOW] }
              customer:
                type: object
                description: >
                  Name, phone and email are blank and `contactHidden` is true for
                  staff whose membership in that shop cannot view customer details.
                properties:
                  id: { type: string }
                  name: { type: string }
                  phone: { type: string }
                  email: { type: string, nullable: true }
                  contactHidden: { type: boolean }
              service:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
              staff:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  email: { type: string, nullable: true }
              shop:
                type: object
                required: [id, name, slug, timezone]
                properties:
                  id: { type: string }
                  name: { type: string }
                  slug: { type: string }
                  timezone: { type: string, description: IANA timezone; format startTime in it. }

  responses:
    NotFound:
      description: Resource not found, or the caller is not a member of the shop
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Unauthorized

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

    Conflict:
      description: Resource conflict (e.g. email already in use)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Returns server status and current timestamp.
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /auth/register:
    post:
      tags: [auth]
      summary: Register a new account
      description: |
        Creates a pending registration and sends an email with a verification link.
        The account is not active until the email is verified via `/auth/verify-email`.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  example: Password123!
      responses:
        '201':
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: success
                data:
                  message: Verification email sent. Please check your inbox.
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Email already in use

  /auth/verify-email:
    post:
      tags: [auth]
      summary: Verify email address
      description: |
        Verifies the token from the verification link together with the password
        chosen at sign-up. On success, creates the user account and marks it as
        verified. A wrong password is a 403 (`INVALID_PASSWORD`) and leaves the
        link usable.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: Verification token from the email link
                password:
                  type: string
                  description: The password chosen at sign-up
      responses:
        '200':
          description: Email verified and account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  value:
                    status: error
                    message: Invalid verification token
                expired:
                  value:
                    status: error
                    message: Verification token expired

  /auth/resend-verification:
    post:
      tags: [auth]
      summary: Resend verification email
      description: |
        Generates a new verification token and resends the email.
        Always returns success to prevent email enumeration.
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Verification email sent (or silently ignored if email not pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: success
                data:
                  message: If a pending registration exists, a new verification email has been sent.
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [auth]
      summary: Log in
      description: |
        Authenticates the user with email and password.

        Returns a short-lived **access token** in the response body and sets a
        long-lived **refresh token** as an `HttpOnly` cookie named `refreshToken`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: Password123!
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie
              schema:
                type: string
                example: refreshToken=eyJ...; Path=/; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Invalid credentials

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      description: |
        Uses the `refreshToken` cookie to issue a new access token and rotate the
        refresh token (token rotation). If the refresh token has already been used
        (reuse attack), all sessions for the user are immediately invalidated.
      operationId: refreshToken
      parameters:
        - in: cookie
          name: refreshToken
          required: true
          schema:
            type: string
      responses:
        '200':
          description: New access token issued
          headers:
            Set-Cookie:
              description: New rotated refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
        '401':
          description: Missing, invalid, expired, or reused refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing:
                  value:
                    status: error
                    message: No refresh token provided
                invalid:
                  value:
                    status: error
                    message: Invalid refresh token
                reused:
                  value:
                    status: error
                    message: Session invalidated. Please log in again.

  /auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: |
        Invalidates the current refresh token and clears the `refreshToken` cookie.
        Access tokens remain valid until they expire (short-lived by design).
      operationId: logout
      parameters:
        - in: cookie
          name: refreshToken
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Logged out successfully
          headers:
            Set-Cookie:
              description: Clears the refresh token cookie
              schema:
                type: string
                example: refreshToken=; Max-Age=0; Path=/; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: success
                data:
                  message: Logged out successfully

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request password reset
      description: |
        Sends a password reset email if the address belongs to an existing account.
        Always returns success to prevent email enumeration.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Reset email sent (or silently ignored)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many requests

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Reset password
      description: |
        Resets the user's password using a valid reset token and invalidates all
        existing sessions to prevent use of any stolen tokens.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: Reset token from the password reset email
                password:
                  type: string
                  minLength: 8
                  example: NewPassword123!
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: success
                data:
                  message: Password reset successfully
        '400':
          description: Invalid, expired, or already-used token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  value:
                    status: error
                    message: Invalid reset token
                expired:
                  value:
                    status: error
                    message: Reset token expired
                used:
                  value:
                    status: error
                    message: Reset token already used

  /auth/sessions:
    get:
      tags: [auth]
      summary: List active sessions
      description: Returns all active refresh token sessions for the authenticated user.
      operationId: getSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [auth]
      summary: Revoke all sessions
      description: |
        Deletes all refresh tokens for the authenticated user, effectively logging
        them out of all devices. Clears the current refresh token cookie.
      operationId: revokeAllSessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: success
                data:
                  message: All sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user/me:
    get:
      tags: [user]
      summary: Get current user
      description: Returns the authenticated user's profile. Never exposes `passwordHash`.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [user]
      summary: Update current user
      description: |
        Updates the authenticated user's email and/or password.

        - **Email change**: marks account as unverified; a new verification email is sent.
        - **Password change**: revokes all active sessions (other devices are logged out).
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: newemail@example.com
                password:
                  type: string
                  minLength: 8
                  example: NewPassword123!
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [user]
      summary: Delete current user
      description: |
        Permanently deletes the authenticated user's account after verifying their
        password. All associated data (sessions, tokens) is removed.
      operationId: deleteMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  example: Password123!
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                status: success
                data:
                  message: Account deleted successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Wrong or missing password (code INVALID_PASSWORD)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /shops/overview:
    get:
      tags: [overview]
      summary: Overview across all of the user's shops
      description: >
        The shop overview (`/shops/{shopId}/overview`) summed across every shop
        the user is an ACTIVE member of (owner, manager or staff, the same set as
        `GET /shops`), plus a `perShop` breakdown.


        The period (`from`, `to`, `today`) is computed ONCE, in the timezone of
        the user's first shop, the one with the oldest membership (ties by shop
        id), so the response has a single calendar axis. Each shop's bookings
        are then taken from those calendar dates in the SHOP's own timezone and
        counted on that shop's own local day (or Monday-start week); bucket
        counts from different shops are summed by date label. With a single
        shop the totals and buckets equal that shop's own overview.


        A user with no shops gets 200 with zero totals, empty-count buckets (in
        UTC) and an empty `perShop`.


        Registered before `/shops/{id}`; "overview" is never read as a shop id.
      operationId: getMyOverview
      security:
        - bearerAuth: []
      parameters:
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [week, month, quarter]
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOverviewResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /shops/upcoming:
    get:
      tags: [overview]
      summary: Upcoming bookings across all of the user's shops
      description: >
        The next 5 bookings from now (canceled and no-show excluded), soonest
        first, across the shops the user is an active member of. Customer
        details are redacted per shop for staff who cannot view them.
      operationId: getMyUpcoming
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Upcoming bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingBookingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /shops/{shopId}/overview:
    get:
      tags: [overview]
      summary: Shop overview for a period
      description: >
        Totals by status and a bookings-per-bucket series for a calendar
        period in the shop's timezone, including future bookings. week: the
        current Monday-Sunday week; month: the current calendar month;
        quarter: the current month plus the previous two, in weekly buckets.
        Available to every active member of the shop.
      operationId: getShopOverview
      security:
        - bearerAuth: []
      parameters:
        - name: shopId
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [week, month, quarter]
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
